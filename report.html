<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - Hyperlocal Weather Impact and Community Alert Web App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-cloud-sun"></i> HyperWeather
            </div>
            <ul class="nav-menu">
                <li><a href="main.html">Home</a></li>
                <li><a href="map.html">Map</a></li>
                <li><a href="alerts.html">Alerts</a></li>
                <li><a href="report.html" class="active">Report</a></li>
            </ul>
        </div>
    </nav>

    <section class="report-section">
        <div class="container">
            <h1>Report an Alert</h1>
            <form class="report-form">
                <div class="form-group">
                    <input type="text" id="location" placeholder=" " autocomplete="off">
                    <label for="location">Location</label>
                </div>
                <div class="form-group">
                    <textarea id="description" placeholder=" "></textarea>
                    <label for="description">Description</label>
                </div>
                <div class="form-group">
                    <input type="file" id="image" accept="image/*">
                    <label for="image">Upload Image</label>
                </div>
                <button type="submit" class="submit-btn">Submit Alert</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
