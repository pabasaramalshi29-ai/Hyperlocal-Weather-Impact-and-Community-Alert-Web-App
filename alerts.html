<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Hyperlocal Weather Impact and Community Alert Web App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-cloud-sun"></i> HyperWeather
            </div>
            <ul class="nav-menu">
                <li><a href="main.html">Home</a></li>
                <li><a href="map.html">Map</a></li>
                <li><a href="alerts.html" class="active">Alerts</a></li>
                <li><a href="report.html">Report</a></li>
            </ul>
        </div>
    </nav>

    <section class="alerts-section">
        <div class="container">
            <h1>Community Alerts</h1>
            <div class="alerts-list">
                <div class="alert-card">
                    <div class="alert-header">
                        <h3>Flood Warning</h3>
                        <span class="severity high">High</span>
                    </div>
                    <p><i class="fas fa-map-marker-alt"></i> Downtown Area</p>
                    <p><i class="fas fa-clock"></i> 2 hours ago</p>
                </div>
                <div class="alert-card">
                    <div class="alert-header">
                        <h3>Power Outage</h3>
                        <span class="severity medium">Medium</span>
                    </div>
                    <p><i class="fas fa-map-marker-alt"></i> Residential Zone</p>
                    <p><i class="fas fa-clock"></i> 5 hours ago</p>
                </div>
                <div class="alert-card">
                    <div class="alert-header">
                        <h3>Heavy Rain</h3>
                        <span class="severity low">Low</span>
                    </div>
                    <p><i class="fas fa-map-marker-alt"></i> City Center</p>
                    <p><i class="fas fa-clock"></i> 1 day ago</p>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
