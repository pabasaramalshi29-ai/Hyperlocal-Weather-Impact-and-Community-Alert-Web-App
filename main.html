<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlocal Weather Impact and Community Alert Web App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-cloud-sun"></i> HyperWeather
            </div>
            <ul class="nav-menu">
                <li><a href="main.html" class="active">Home</a></li>
                <li><a href="map.html">Map</a></li>
                <li><a href="alerts.html">Alerts</a></li>
                <li><a href="report.html">Report</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1>Hyperlocal Weather Impact & Community Alerts</h1>
            <p>Get real-time weather updates and community alerts for your area.</p>
            <div class="search-bar">
                <input type="text" placeholder="Enter your location..." id="location-search">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </section>

    <section class="dashboard">
        <div class="container">
            <div class="weather-card">
                <h2>Current Weather</h2>
                <div class="weather-info">
                    <div class="temp">
                        <i class="fas fa-thermometer-half"></i>
                        <span id="temperature">72°F</span>
                    </div>
                    <div class="rain">
                        <i class="fas fa-cloud-rain"></i>
                        <span id="rain">20% chance</span>
                    </div>
                    <div class="wind">
                        <i class="fas fa-wind"></i>
                        <span id="wind">5 mph</span>
                    </div>
                </div>
            </div>

            <div class="alert-banner">
                <h2><i class="fas fa-exclamation-triangle"></i> High Priority Alert</h2>
                <p>Heavy rain expected in your area. Prepare for flooding.</p>
                <button class="alert-btn">View Details</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
